name: Check application
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify existing Render build command
        run: |
          mkdir -p dist
          cp index.html styles.css app.js core.js dist/
          cp -R assets dist/assets
          npm run check:public
      - run: npm run typecheck
      - run: npm run build:live
      - run: npm run check:public
      - run: node --test tests/live/*.test.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - uses: actions/upload-artifact@v5
        if: ${{ success() }}
        with:
          name: public-static
          path: dist/
          if-no-files-found: error
          retention-days: 7
